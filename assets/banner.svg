<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filters for Neon Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #ffffff;
    }
    
    /* Subtle SVG CSS Animations for Dynamic Aspect */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes wavePath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    
    .animated-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .animated-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 220px;
    }
    .animated-wave {
      stroke-dasharray: 20 10;
      animation: wavePath 30s linear infinite;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="2" />

  <!-- Background Decorative Glowing Orbs (Positioned behind content) -->
  <circle class="animated-orb-1" cx="180" cy="90" r="140" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle class="animated-orb-2" cx="1020" cy="230" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" />

  <!-- Dynamic Animated Grid & Wave Lines in Background -->
  <path class="animated-wave" d="M -100 240 Q 300 120 600 240 T 1300 240" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4" />
  <path class="animated-wave" d="M -100 270 Q 300 150 600 270 T 1300 270" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.3" />

  <!-- Foreground Main Title & Subtitle (Guaranteed high visibility) -->
  <g transform="translate(60, 110)">
    <!-- Top Decorative Line -->
    <rect x="0" y="-45" width="80" height="5" rx="2.5" fill="url(#primaryGlow)" />
    
    <!-- Title -->
    <text x="0" y="10" class="title">Awesome AI Adoption Analytics 📊 🚀</text>
    
    <!-- Subtitle -->
    <text x="0" y="52" class="subtitle">Curated List of SaaS Platforms &amp; Open-Source Projects for AI Usage, ROI &amp; Sentiment Measurement</text>
  </g>

  <!-- Foreground Feature Badges/Pills (Positioned cleanly below text) -->
  <g transform="translate(60, 225)">
    <!-- Pill 1: SaaS & Open Source -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="105" y="24" text-anchor="middle" class="pill-text">⚡ SaaS &amp; Open-Source</text>
    </g>

    <!-- Pill 2: Copilot & LLM ROI -->
    <g transform="translate(225, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="90" y="24" text-anchor="middle" class="pill-text">🎯 Usage &amp; ROI Tracking</text>
    </g>

    <!-- Pill 3: Sentiment & Telemetry -->
    <g transform="translate(420, 0)">
      <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="105" y="24" text-anchor="middle" class="pill-text">💡 Sentiment &amp; Telemetry</text>
    </g>

    <!-- Pill 4: Production Ready -->
    <g transform="translate(645, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="90" y="24" text-anchor="middle" class="pill-text">🛡️ IT &amp; DevEx Ready</text>
    </g>
  </g>
</svg>
